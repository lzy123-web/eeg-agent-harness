[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-agent-harness"
version = "0.2.0"
description = "Minimal deterministic EEG analysis baseline migrated from EEGAgent"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "mne==1.6.1",
  "numpy==1.24.4",
  "scipy==1.10.1",
  "torch==2.14.1",
]

[project.scripts]
eeg-harness-baseline = "eeg_harness.cli:main"
eeg-harness-workflow = "eeg_harness.workflow_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
