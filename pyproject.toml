[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-agent-harness"
version = "1.0.0"
description = "Minimal deterministic EEG analysis baseline migrated from EEGAgent"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "mne==1.6.1",
  "numpy==1.24.4",
  "scipy==1.10.1",
  "torch==2.14.1",
]

[project.scripts]
eeg-harness-baseline = "eeg_harness.cli:main"
eeg-harness-workflow = "eeg_harness.workflow_cli:main"
eeg-harness-agent = "eeg_harness.agent_cli:main"
eeg-harness-working-memory = "eeg_harness.working_memory_cli:main"
eeg-harness-events = "eeg_harness.event_cli:main"
eeg-harness-r3-diagnostic = "eeg_harness.applications.r3.cli:main"
eeg-harness-r3 = "eeg_harness.applications.r3.analysis_cli:main"
eeg-harness-plan = "eeg_harness.plan_cli:main"
eeg-harness-evidence = "eeg_harness.evidence_cli:main"
eeg-harness-llm-smoke = "eeg_harness.llm_smoke:main"
eeg-harness-real-llm = "eeg_harness.real_llm_evaluation:main"
eeg-harness-baseline-v1 = "eeg_harness.baseline_v1:main"
eeg-harness-semantic-pilot = "eeg_harness.research.semantic_planning.cli:main"
eeg-harness-intent-pilot = "eeg_harness.research.intent_alignment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
